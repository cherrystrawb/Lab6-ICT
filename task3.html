<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Continental Hotel Reservation Form</title>

<style>
body {
background-color: #e0e0e0;
font-family: "Times New Roman", serif;
}

h1 {
color: red;
font-family: Arial, sans-serif;
font-size: 20px;
text-align: center;
margin: 28px 0 20px;
}

form {
width: 440px;
max-width: 100%;
margin: auto;
}

table {
width: 100%;
border: 2px outset gray;
border-spacing: 2px;
background-color: #cce5ff;
}

th, td {
border: 1px solid #666;
padding: 5px;
}

th {
width: 125px;
text-align: right;
}

input, select, button {
font-family: Arial, sans-serif;
font-size: 13px;
}

input[type="text"],
input[type="email"],
input[type="tel"] {
width: 200px;
box-sizing: border-box;
}

input[type="time"] {
width: 142px;
}

.departure {
display: flex;
gap: 4px;
}

.departure input {
width: 50%;
min-width: 0;
box-sizing: border-box;
}

label {
white-space: nowrap;
}

.submit-row {
text-align: center;
}
</style>
</head>

<body>
<h1>Continental Hotel Reservation Form</h1>

<form action="task3.html" method="get">
<table>
<tr>
<th><label for="name">Name</label></th>
<td>
<input type="text" id="name" name="name" placeholder="Enter your name" required>
</td>
</tr>

<tr>
<th><label for="email">eMail</label></th>
<td>
<input type="email" id="email" name="email" value="info@continental.pk" required>
</td>
</tr>

<tr>
<th><label for="mobile">Mobile No</label></th>
<td>
<input type="tel" id="mobile" name="mobile" placeholder="Enter your cell number" required>
</td>
</tr>

<tr>
<th><label for="arrival">Arrival Time</label></th>
<td>
<input type="time" id="arrival" name="arrival" required>
</td>
</tr>

<tr>
<th>Departure</th>
<td>
<div class="departure">
<input type="date" name="departure_date" aria-label="Departure date" required>
<input type="time" name="departure_time" aria-label="Departure time" required>
</div>
</td>
</tr>

<tr>
<th>Room Type</th>
<td>
<label>
<input type="radio" name="room" value="single" required>
Single
</label>

<label>
<input type="radio" name="room" value="double">
Double
</label>

<br>

<label>
<input type="radio" name="room" value="presidential">
Presidential Suite
</label>
</td>
</tr>

<tr>
<th>Preferences</th>
<td>
<label>
<input type="checkbox" name="preferences" value="non-smoking">
Non-Smoking
</label>

<br>

<label>
<input type="checkbox" name="preferences" value="internet">
Internet
</label>

<br>

<label>
<input type="checkbox" name="preferences" value="firm-mattress">
Firm Mattress
</label>
</td>
</tr>

<tr>
<th>Mode of Payment</th>
<td>
<label>
<input type="checkbox" name="payment" value="cash">
Cash
</label>

<label>
<input type="checkbox" name="payment" value="check">
Check
</label>

<br>

<label>
<input type="checkbox" name="payment" value="credit-card">
Credit Card
</label>

<select name="card" aria-label="Select card">
<option value="">Select Card</option>
<option value="visa">Visa</option>
<option value="mastercard">Mastercard</option>
<option value="amex">American Express</option>
</select>
</td>
</tr>

<tr>
<td colspan="2" class="submit-row">
<button type="submit">Send Data</button>
</td>
</tr>
</table>
</form>
</body>
</html>
